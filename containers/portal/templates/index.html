<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n01d-portal | Container Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-hover: #1a1a25;
            --accent: #00ff88;
            --accent-dim: #00aa5c;
            --danger: #ff4757;
            --warning: #ffa502;
            --text: #e0e0e0;
            --text-dim: #888;
            --border: #2a2a35;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #12121a 0%, #1a1a25 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px;
            text-align: center;
        }
        
        .logo {
            font-size: 1.8em;
            color: var(--accent);
            margin-bottom: 5px;
        }
        
        .logo span {
            color: var(--text-dim);
        }
        
        .subtitle {
            color: var(--text-dim);
            font-size: 0.85em;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent);
        }
        
        .stat-value.danger { color: var(--danger); }
        .stat-value.warning { color: var(--warning); }
        
        .stat-label {
            font-size: 0.75em;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        
        .btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }
        
        .btn.danger:hover {
            background: var(--danger);
            border-color: var(--danger);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .category {
            margin-bottom: 30px;
        }
        
        .category-title {
            font-size: 0.9em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            border-color: var(--accent-dim);
            transform: translateY(-2px);
        }
        
        .card.running {
            border-left: 3px solid var(--accent);
        }
        
        .card.stopped {
            border-left: 3px solid var(--danger);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .card-icon {
            font-size: 1.8em;
        }
        
        .card-title {
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .card-name {
            font-size: 0.75em;
            color: var(--text-dim);
        }
        
        .card-desc {
            color: var(--text-dim);
            font-size: 0.85em;
            margin-bottom: 15px;
        }
        
        .card-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }
        
        .status-dot.running {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
        
        .status-text {
            font-size: 0.8em;
            color: var(--text-dim);
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .card-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 12px;
            font-size: 0.75em;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .card-btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }
        
        .card-btn.stop:hover {
            background: var(--danger);
        }
        
        .card-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-title {
            color: var(--accent);
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5em;
            cursor: pointer;
        }
        
        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }
        
        .logs {
            background: #000;
            color: #0f0;
            font-size: 0.8em;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow: auto;
        }
        
        .terminal-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .terminal-input input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            font-family: inherit;
            border-radius: 4px;
        }
        
        .terminal-input input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
        }
        
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 5px;
            margin-top: 10px;
            animation: slideIn 0.3s ease;
        }
        
        .toast.error {
            border-color: var(--danger);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .quick-cmd {
            background: var(--bg-dark);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.8em;
            color: var(--accent);
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .quick-cmd:hover {
            background: var(--bg-hover);
        }
        
        @media (max-width: 600px) {
            .stats-bar {
                flex-wrap: wrap;
            }
            .controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">n01d<span>-portal</span></div>
        <div class="subtitle">Container Dashboard | bad-antics</div>
    </header>
    
    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value" id="total-count">-</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="running-count">-</div>
            <div class="stat-label">Running</div>
        </div>
        <div class="stat">
            <div class="stat-value danger" id="stopped-count">-</div>
            <div class="stat-label">Stopped</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="refreshAll()">↻ Refresh</button>
        <button class="btn" onclick="startAll()">▶ Start All</button>
        <button class="btn danger" onclick="stopAll()">■ Stop All</button>
    </div>
    
    <main class="main">
        <div class="category">
            <h2 class="category-title">🛡️ Security</h2>
            <div class="grid" id="security-grid"></div>
        </div>
        
        <div class="category">
            <h2 class="category-title">🌐 Network</h2>
            <div class="grid" id="network-grid"></div>
        </div>
        
        <div class="category">
            <h2 class="category-title">🔧 Tools</h2>
            <div class="grid" id="tools-grid"></div>
        </div>
        
        <div class="category">
            <h2 class="category-title">💻 Development</h2>
            <div class="grid" id="dev-grid"></div>
        </div>
    </main>
    
    <!-- Logs Modal -->
    <div class="modal" id="logs-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Container Logs</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="logs" id="logs-content">Loading...</div>
                <div class="terminal-input">
                    <input type="text" id="cmd-input" placeholder="Enter command..." onkeypress="handleCmdKey(event)">
                    <button class="btn" onclick="execCommand()">Run</button>
                </div>
                <div class="quick-cmd" onclick="copyTerminalCmd()">
                    📋 <span id="terminal-cmd"></span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toast-container"></div>
    
    <script>
        let containers = [];
        let currentContainer = null;
        
        async function fetchContainers() {
            try {
                const res = await fetch('/api/containers');
                containers = await res.json();
                renderContainers();
                updateStats();
            } catch (e) {
                showToast('Failed to fetch containers', true);
            }
        }
        
        function updateStats() {
            const running = containers.filter(c => c.running).length;
            document.getElementById('total-count').textContent = containers.length;
            document.getElementById('running-count').textContent = running;
            document.getElementById('stopped-count').textContent = containers.length - running;
        }
        
        function renderContainers() {
            const grids = {
                security: document.getElementById('security-grid'),
                network: document.getElementById('network-grid'),
                tools: document.getElementById('tools-grid'),
                dev: document.getElementById('dev-grid')
            };
            
            Object.values(grids).forEach(g => g.innerHTML = '');
            
            containers.forEach(c => {
                const card = createCard(c);
                const grid = grids[c.category];
                if (grid) grid.appendChild(card);
            });
        }
        
        function createCard(c) {
            const div = document.createElement('div');
            div.className = `card ${c.running ? 'running' : 'stopped'}`;
            div.innerHTML = `
                <div class="card-header">
                    <span class="card-icon">${c.icon}</span>
                    <div>
                        <div class="card-title">${c.name}</div>
                        <div class="card-name">${c.name}</div>
                    </div>
                </div>
                <div class="card-desc">${c.desc}</div>
                <div class="card-status">
                    <span class="status-dot ${c.running ? 'running' : ''}"></span>
                    <span class="status-text">${c.status}${c.id ? ' • ' + c.id : ''}</span>
                </div>
                <div class="card-actions">
                    <button class="card-btn" onclick="startContainer('${c.name}')" ${c.running ? 'disabled' : ''}>▶ Start</button>
                    <button class="card-btn stop" onclick="stopContainer('${c.name}')" ${!c.running ? 'disabled' : ''}>■ Stop</button>
                    <button class="card-btn" onclick="showLogs('${c.name}')" ${!c.running ? 'disabled' : ''}>📋 Logs</button>
                </div>
            `;
            return div;
        }
        
        async function startContainer(name) {
            showToast(`Starting ${name}...`);
            try {
                const res = await fetch(`/api/container/${name}/start`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(`${name} started`);
                    fetchContainers();
                } else {
                    showToast(data.error || 'Failed to start', true);
                }
            } catch (e) {
                showToast('Failed to start container', true);
            }
        }
        
        async function stopContainer(name) {
            showToast(`Stopping ${name}...`);
            try {
                const res = await fetch(`/api/container/${name}/stop`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(`${name} stopped`);
                    fetchContainers();
                } else {
                    showToast(data.error || 'Failed to stop', true);
                }
            } catch (e) {
                showToast('Failed to stop container', true);
            }
        }
        
        async function showLogs(name) {
            currentContainer = name;
            document.getElementById('modal-title').textContent = `${name} - Logs & Terminal`;
            document.getElementById('terminal-cmd').textContent = `docker exec -it ${name} bash`;
            document.getElementById('logs-modal').classList.add('active');
            document.getElementById('logs-content').textContent = 'Loading...';
            
            try {
                const res = await fetch(`/api/container/${name}/logs`);
                const data = await res.json();
                document.getElementById('logs-content').textContent = data.logs || 'No logs available';
            } catch (e) {
                document.getElementById('logs-content').textContent = 'Failed to fetch logs';
            }
        }
        
        function closeModal() {
            document.getElementById('logs-modal').classList.remove('active');
            currentContainer = null;
        }
        
        async function execCommand() {
            if (!currentContainer) return;
            const input = document.getElementById('cmd-input');
            const cmd = input.value.trim();
            if (!cmd) return;
            
            const logsEl = document.getElementById('logs-content');
            logsEl.textContent += `\n$ ${cmd}\n`;
            input.value = '';
            
            try {
                const res = await fetch(`/api/container/${currentContainer}/exec`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                logsEl.textContent += data.output || data.error || 'No output';
                logsEl.scrollTop = logsEl.scrollHeight;
            } catch (e) {
                logsEl.textContent += 'Command failed\n';
            }
        }
        
        function handleCmdKey(e) {
            if (e.key === 'Enter') execCommand();
        }
        
        function copyTerminalCmd() {
            const cmd = document.getElementById('terminal-cmd').textContent;
            navigator.clipboard.writeText(cmd);
            showToast('Command copied!');
        }
        
        async function startAll() {
            showToast('Starting all containers...');
            await fetch('/api/all/start', { method: 'POST' });
            setTimeout(fetchContainers, 2000);
        }
        
        async function stopAll() {
            showToast('Stopping all containers...');
            await fetch('/api/all/stop', { method: 'POST' });
            setTimeout(fetchContainers, 2000);
        }
        
        function refreshAll() {
            fetchContainers();
            showToast('Refreshed');
        }
        
        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Init
        fetchContainers();
        setInterval(fetchContainers, 10000);
        
        // Close modal on escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
