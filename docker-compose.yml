#╔════════════════════════════════════════════════════════════════════════════════╗
#║                           N01D DOCKER STACK v2.0                               ║
#║    Security · AI/ML · Image Gen · Music Gen · Agent Zero | bad-antics        ║
#╚════════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  NETWORK ACCESS CHEAT SHEET (from any machine on your LAN)                 │
# │                                                                             │
# │  Replace <HOST_IP> with this machine's LAN IP (run: ipconfig)              │
# │                                                                             │
# │  Open WebUI (chat)      → http://<HOST_IP>:3080                            │
# │  Ollama API             → http://<HOST_IP>:11434                           │
# │  Agent Zero             → http://<HOST_IP>:3100                            │
# │  ComfyUI (images)       → http://<HOST_IP>:8188                            │
# │  MusicGen (music)       → http://<HOST_IP>:7860                            │
#  mitmproxy proxy        → http://<HOST_IP>:9090                            │
# │  mitmproxy web          → http://<HOST_IP>:8081                            │
# │  Dev ports              → http://<HOST_IP>:3000 / :8000                    │
# └─────────────────────────────────────────────────────────────────────────────┘

name: n01d

services:

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║                        🧠 AI / LLM SERVICES                             ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝

  # ═══════════════════════════════════════════════════════════════════════════════
  # OLLAMA - Local LLM Engine (serves ALL text models)
  # After startup run:  docker exec n01d-ollama /scripts/pull-models.sh
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-ollama:
    image: ollama/ollama:latest
    container_name: n01d-ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
      - ./scripts:/scripts:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
      # Uncomment if you upgrade GPU (GTX 980 = limited VRAM):
      # - NVIDIA_VISIBLE_DEVICES=all
    networks:
      n01d-net:
        ipv4_address: 172.28.0.50
    # Uncomment for GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════════════════════════
  # OPEN WEBUI - ChatGPT-style frontend for ALL Ollama models
  # Access: http://<HOST_IP>:3080
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: n01d-webui
    hostname: webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3080}:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://n01d-ollama:11434
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
      - WEBUI_NAME=N01D AI Lab
      - DEFAULT_MODELS=dolphin-mistral:7b
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_IMAGE_GENERATION=true
      - COMFYUI_BASE_URL=http://n01d-comfyui:8188
    depends_on:
      - n01d-ollama
    networks:
      n01d-net:
        ipv4_address: 172.28.0.51

  # ═══════════════════════════════════════════════════════════════════════════════
  # AGENT ZERO - Autonomous AI Agent Framework
  # Fully autonomous agent with tool use, code execution, web browsing
  # Access: http://<HOST_IP>:3100
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-agent-zero:
    image: frdel/agent-zero-run:latest
    container_name: n01d-agent-zero
    hostname: agent-zero
    restart: unless-stopped
    ports:
      - "${AGENT_ZERO_PORT:-3100}:80"
    volumes:
      - ./data/agent-zero:/app/work_dir
    environment:
      - OLLAMA_BASE_URL=http://n01d-ollama:11434
      - CHAT_MODEL=${AGENT_ZERO_MODEL:-dolphin-mistral:7b}
      - UTILITY_MODEL=${AGENT_ZERO_UTIL_MODEL:-dolphin-mistral:7b}
      - EMBEDDING_MODEL=${AGENT_ZERO_EMBED_MODEL:-nomic-embed-text:latest}
    depends_on:
      - n01d-ollama
    networks:
      n01d-net:
        ipv4_address: 172.28.0.52

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║                    🎨 CREATIVE / GENERATIVE SERVICES                     ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝

  # ═══════════════════════════════════════════════════════════════════════════════
  # COMFYUI - Image / Logo / Art Generation (Stable Diffusion)
  # Node-based workflow UI for SD, SDXL, Flux, etc.
  # Access: http://<HOST_IP>:8188
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-comfyui:
    image: yanwk/comfyui-boot:cpu
    container_name: n01d-comfyui
    hostname: comfyui
    restart: unless-stopped
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ./data/comfyui/storage:/root
      - ./data/comfyui/models:/root/ComfyUI/models
      - ./data/comfyui/output:/root/ComfyUI/output
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --preview-method auto --cpu
    networks:
      n01d-net:
        ipv4_address: 172.28.0.60
    # Uncomment for GPU (highly recommended for image gen):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════════════════════════
  # MUSICGEN - AI Music Generation (Meta's MusicGen via Audiocraft)
  # Text-to-music, melody conditioning, full tracks
  # Access: http://<HOST_IP>:7860
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-musicgen:
    image: python:3.10-bookworm
    container_name: n01d-musicgen
    hostname: musicgen
    restart: unless-stopped
    ports:
      - "${MUSICGEN_PORT:-7860}:7860"
    volumes:
      - ./data/musicgen/output:/app/output
      - ./data/musicgen/cache:/root/.cache
      - ./containers/musicgen/app.py:/app/app.py:ro
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install av==14.0.1
        pip install --no-deps audiocraft
        pip install gradio scipy soundfile demucs encodec flashy lameenc num2words spacy transformers huggingface_hub safetensors sentencepiece protobuf einops librosa hydra-core hydra_colorlog torchmetrics

        # Create a stub xformers module so audiocraft imports don't crash on CPU
        mkdir -p /usr/local/lib/python3.10/site-packages/xformers/ops/fmha
        cat > /usr/local/lib/python3.10/site-packages/xformers/__init__.py << 'STUB'
        # Stub xformers for CPU-only mode
        STUB
        cat > /usr/local/lib/python3.10/site-packages/xformers/ops/__init__.py << 'STUB'
        # Stub - audiocraft imports xformers.ops
        class MemoryEfficientAttentionFlashAttentionOp:
            pass
        class MemoryEfficientAttentionCutlassOp:
            pass
        class MemoryEfficientAttentionOp:
            pass
        def memory_efficient_attention(*args, **kwargs):
            raise NotImplementedError("xformers not available in CPU mode")
        def fmha(*args, **kwargs):
            raise NotImplementedError("xformers not available in CPU mode")
        STUB
        cat > /usr/local/lib/python3.10/site-packages/xformers/ops/fmha/__init__.py << 'STUB'
        # Stub
        STUB

        cd /app && python app.py
    networks:
      n01d-net:
        ipv4_address: 172.28.0.61
    # Uncomment for GPU (recommended for faster generation):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║                      🔴 SECURITY / PENTEST SERVICES                      ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝

  # ═══════════════════════════════════════════════════════════════════════════════
  # PENTEST - Kali-based security testing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-pentest:
    build:
      context: ./containers/pentest
      dockerfile: Dockerfile
    container_name: n01d-pentest
    hostname: pentest
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - ./data:/data
      - ./config:/config
    networks:
      n01d-net:
        ipv4_address: 172.28.0.10
    environment:
      - TERM=xterm-256color
      - N01D_MODE=pentest
      - OLLAMA_BASE_URL=http://n01d-ollama:11434

  # ═══════════════════════════════════════════════════════════════════════════════
  # DEV - Multi-language development environment
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-dev:
    build:
      context: ./containers/dev
      dockerfile: Dockerfile
    container_name: n01d-dev
    hostname: dev
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
      - ./config:/config
    ports:
      - "3000:3000"
      - "8000:8000"
    networks:
      n01d-net:
        ipv4_address: 172.28.0.11
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # JULIA - Julia security research
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-julia:
    build:
      context: ./containers/julia
      dockerfile: Dockerfile
    container_name: n01d-julia
    hostname: julia
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.12
    environment:
      - JULIA_NUM_THREADS=auto

  # ═══════════════════════════════════════════════════════════════════════════════
  # CTF - Lightweight CTF environment
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-ctf:
    build:
      context: ./containers/ctf
      dockerfile: Dockerfile
    container_name: n01d-ctf
    hostname: ctf
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.13

  # ═══════════════════════════════════════════════════════════════════════════════
  # PROXY - mitmproxy for traffic interception
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-proxy:
    build:
      context: ./containers/proxy
      dockerfile: Dockerfile
    container_name: n01d-proxy
    hostname: proxy
    ports:
      - "${PROXY_PORT:-9090}:8080"
      - "${PROXY_WEB_PORT:-8081}:8081"
    volumes:
      - ./config/mitmproxy:/home/mitmproxy/.mitmproxy
    networks:
      n01d-net:
        ipv4_address: 172.28.0.20

  # ═══════════════════════════════════════════════════════════════════════════════
  # VPN - WireGuard VPN
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-vpn:
    build:
      context: ./containers/vpn
      dockerfile: Dockerfile
    container_name: n01d-vpn
    hostname: vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    volumes:
      - ./config/wireguard:/etc/wireguard
    networks:
      n01d-net:
        ipv4_address: 172.28.0.30

# ═════════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════════════════
networks:
  n01d-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

  # ═══════════════════════════════════════════════════════════════════════════════
  # FORGE - Secure image burning & encryption
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-forge:
    build:
      context: ./containers/forge
      dockerfile: Dockerfile
    container_name: n01d-forge
    hostname: forge
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./data:/data
      - /dev:/dev:ro
    networks:
      n01d-net:
        ipv4_address: 172.28.0.14
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # MACHINE - VM Manager with sandboxing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-machine:
    build:
      context: ./containers/machine
      dockerfile: Dockerfile
    container_name: n01d-machine
    hostname: machine
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./data:/data
      - ./vms:/vms
      - /dev/kvm:/dev/kvm
    networks:
      n01d-net:
        ipv4_address: 172.28.0.15
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # OSINT - NullSec OSINT & recon tools
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-osint:
    build:
      context: ./containers/osint
      dockerfile: Dockerfile
    container_name: n01d-osint
    hostname: osint
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.16
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # MOBILE - NullKia mobile security testing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-mobile:
    build:
      context: ./containers/mobile
      dockerfile: Dockerfile
    container_name: n01d-mobile
    hostname: mobile
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./data:/data
      - /dev/bus/usb:/dev/bus/usb
    networks:
      n01d-net:
        ipv4_address: 172.28.0.17
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # AUTOMOTIVE - BlackFlag ECU testing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-automotive:
    build:
      context: ./containers/automotive
      dockerfile: Dockerfile
    container_name: n01d-automotive
    hostname: automotive
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.18
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # STEALTH - Ghost network stealth & spoofing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-stealth:
    build:
      context: ./containers/stealth
      dockerfile: Dockerfile
    container_name: n01d-stealth
    hostname: stealth
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.19
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # PORTAL - Unified Container Dashboard
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-portal:
    build:
      context: ./containers/portal
      dockerfile: Dockerfile
    container_name: n01d-portal
    hostname: portal
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      n01d-net:
        ipv4_address: 172.28.0.2
    environment:
      - TERM=xterm-256color
      - SECRET_KEY=n01d-portal-${RANDOM}

networks:
  n01d-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
