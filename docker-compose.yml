#╔════════════════════════════════════════════════════════════════════════════════╗
#║                           N01D DOCKER STACK                                    ║
#║              Custom Security & Development Environment | bad-antics           ║
#╚════════════════════════════════════════════════════════════════════════════════╝

name: n01d

services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # PENTEST - Kali-based security testing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-pentest:
    build:
      context: ./containers/pentest
      dockerfile: Dockerfile
    container_name: n01d-pentest
    hostname: pentest
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - ./data:/data
      - ./config:/config
      - /dev/net/tun:/dev/net/tun
    networks:
      n01d-net:
        ipv4_address: 172.28.0.10
    environment:
      - TERM=xterm-256color
      - N01D_MODE=pentest

  # ═══════════════════════════════════════════════════════════════════════════════
  # DEV - Multi-language development environment
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-dev:
    build:
      context: ./containers/dev
      dockerfile: Dockerfile
    container_name: n01d-dev
    hostname: dev
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
      - ./config:/config
      - ${HOME}/.gitconfig:/home/n01d/.gitconfig:ro
      - ${HOME}/.ssh:/home/n01d/.ssh:ro
    ports:
      - "3000:3000"
      - "8000:8000"
    networks:
      n01d-net:
        ipv4_address: 172.28.0.11
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # JULIA - Julia security research
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-julia:
    build:
      context: ./containers/julia
      dockerfile: Dockerfile
    container_name: n01d-julia
    hostname: julia
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.12
    environment:
      - JULIA_NUM_THREADS=auto

  # ═══════════════════════════════════════════════════════════════════════════════
  # CTF - Lightweight CTF environment
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-ctf:
    build:
      context: ./containers/ctf
      dockerfile: Dockerfile
    container_name: n01d-ctf
    hostname: ctf
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.13

  # ═══════════════════════════════════════════════════════════════════════════════
  # PROXY - mitmproxy for traffic interception
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-proxy:
    build:
      context: ./containers/proxy
      dockerfile: Dockerfile
    container_name: n01d-proxy
    hostname: proxy
    ports:
      - "${PROXY_PORT:-8080}:8080"
      - "${PROXY_WEB_PORT:-8081}:8081"
    volumes:
      - ./config/mitmproxy:/home/mitmproxy/.mitmproxy
    networks:
      n01d-net:
        ipv4_address: 172.28.0.20

  # ═══════════════════════════════════════════════════════════════════════════════
  # VPN - WireGuard VPN
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-vpn:
    build:
      context: ./containers/vpn
      dockerfile: Dockerfile
    container_name: n01d-vpn
    hostname: vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    volumes:
      - ./config/wireguard:/etc/wireguard
    networks:
      n01d-net:
        ipv4_address: 172.28.0.30

# ═════════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════════════════
networks:
  n01d-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

  # ═══════════════════════════════════════════════════════════════════════════════
  # FORGE - Secure image burning & encryption
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-forge:
    build:
      context: ./containers/forge
      dockerfile: Dockerfile
    container_name: n01d-forge
    hostname: forge
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./data:/data
      - /dev:/dev:ro
    networks:
      n01d-net:
        ipv4_address: 172.28.0.14
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # MACHINE - VM Manager with sandboxing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-machine:
    build:
      context: ./containers/machine
      dockerfile: Dockerfile
    container_name: n01d-machine
    hostname: machine
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./data:/data
      - ./vms:/vms
      - /dev/kvm:/dev/kvm
    networks:
      n01d-net:
        ipv4_address: 172.28.0.15
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # OSINT - NullSec OSINT & recon tools
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-osint:
    build:
      context: ./containers/osint
      dockerfile: Dockerfile
    container_name: n01d-osint
    hostname: osint
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.16
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # MOBILE - NullKia mobile security testing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-mobile:
    build:
      context: ./containers/mobile
      dockerfile: Dockerfile
    container_name: n01d-mobile
    hostname: mobile
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./data:/data
      - /dev/bus/usb:/dev/bus/usb
    networks:
      n01d-net:
        ipv4_address: 172.28.0.17
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # AUTOMOTIVE - BlackFlag ECU testing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-automotive:
    build:
      context: ./containers/automotive
      dockerfile: Dockerfile
    container_name: n01d-automotive
    hostname: automotive
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.18
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # STEALTH - Ghost network stealth & spoofing
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-stealth:
    build:
      context: ./containers/stealth
      dockerfile: Dockerfile
    container_name: n01d-stealth
    hostname: stealth
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
    networks:
      n01d-net:
        ipv4_address: 172.28.0.19
    environment:
      - TERM=xterm-256color

  # ═══════════════════════════════════════════════════════════════════════════════
  # PORTAL - Unified Container Dashboard
  # ═══════════════════════════════════════════════════════════════════════════════
  n01d-portal:
    build:
      context: ./containers/portal
      dockerfile: Dockerfile
    container_name: n01d-portal
    hostname: portal
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      n01d-net:
        ipv4_address: 172.28.0.2
    environment:
      - TERM=xterm-256color
      - SECRET_KEY=n01d-portal-${RANDOM}

networks:
  n01d-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
